<pattern id="blk2" width="18" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><rect x="1.5" y="1.5" width="14" height="10" rx="1.5" fill="#E3D6BC"/><rect x="1.5" y="1.5" width="14" height="10" rx="1.5" fill="none" stroke="#D5C6A6" stroke-width="0.6"/></pattern>
<clipPath id="oldTown"><path d="M130 560C150 500 220 470 300 480S440 520 470 590S430 700 340 720S160 690 130 560Z"/></clipPath>
