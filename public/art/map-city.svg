<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1120" width="780" height="1120" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2EADA"/><stop offset="1" stop-color="#EADFC9"/></linearGradient>
<radialGradient id="hillshade" cx="330" cy="470" r="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B98A66" stop-opacity="0.5"/><stop offset="0.45" stop-color="#D2AE8C" stop-opacity="0.32"/><stop offset="1" stop-color="#E8D9BE" stop-opacity="0"/></radialGradient>
<radialGradient id="hillshade2" cx="640" cy="260" r="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C9A67E" stop-opacity="0.35"/><stop offset="1" stop-color="#E8D9BE" stop-opacity="0"/></radialGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C5D9D6"/><stop offset="1" stop-color="#B5CECC"/></linearGradient>
<linearGradient id="park" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8DFBC"/><stop offset="1" stop-color="#C9D3A6"/></linearGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0.7 0 0 0 -0.3"/></filter>
